#!/usr/sbin/nft -f
# Firewall do projeto - politica padrao DROP
# Interfaces: enp0s3=WAN (NAT), enp0s8=DMZ, enp0s9=LAN, enp0s10=DB Zone
flush ruleset

define WAN   = "enp0s3"
define DMZ   = "enp0s8"
define LAN   = "enp0s9"
define DBZ   = "enp0s10"
define WEB   = 10.0.1.10
define FILES = 10.0.2.10
define DB    = 10.0.3.10

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname "lo" accept
    # ping de diagnostico vindo das zonas internas
    iifname { $DMZ, $LAN, $DBZ } icmp type echo-request accept
    # DNS para as zonas internas
    iifname { $DMZ, $LAN, $DBZ } udp dport 53 accept
    iifname { $DMZ, $LAN, $DBZ } tcp dport 53 accept
    # DHCP apenas para a LAN
    iifname $LAN udp dport 67 accept
    # SSH de gerenciamento: LAN e acesso do laboratorio (host via NAT)
    iifname $LAN tcp dport 22 accept
    iifname $WAN ip saddr 192.168.100.0/24 tcp dport 22 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop

    # Qualquer (WAN) -> servidor web: 80/443 (depois do DNAT)
    iifname $WAN oifname $DMZ ip daddr $WEB tcp dport { 80, 443 } accept
    # Servidor web -> PostgreSQL: 5432
    iifname $DMZ oifname $DBZ ip saddr $WEB ip daddr $DB tcp dport 5432 accept
    # LAN (admin) -> todas as zonas: SSH
    iifname $LAN tcp dport 22 accept
    # Backup: db -> servidor de arquivos via SSH (regra adicional, documentada no relatorio)
    iifname $DBZ oifname $LAN ip saddr $DB ip daddr $FILES tcp dport 22 accept
    # DMZ/WAN -> DB Zone: bloquear todo o resto (com log)
    iifname { $DMZ, $WAN } oifname $DBZ limit rate 5/minute log prefix "FW-DROP-DB: "
    iifname { $DMZ, $WAN } oifname $DBZ counter drop
    # Saida para a Internet
    iifname { $DMZ, $LAN } oifname $WAN accept
    iifname $DBZ oifname $WAN udp dport 53 accept
    iifname $DBZ oifname $WAN tcp dport { 53, 80, 443 } accept
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname $WAN tcp dport { 80, 443 } dnat to $WEB
  }
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname $WAN masquerade
  }
}
