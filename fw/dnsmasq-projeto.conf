# /etc/dnsmasq.d/projeto.conf - DNS e DHCP no firewall
# Escuta apenas nas interfaces internas
interface=enp0s8
interface=enp0s9
interface=enp0s10
except-interface=lo
bind-interfaces

# DNS interno (empresa.local, direto e reverso)
domain=empresa.local
local=/empresa.local/
expand-hosts
no-resolv
server=8.8.8.8
server=1.1.1.1
host-record=fw.empresa.local,10.0.1.1,10.0.2.1,10.0.3.1
host-record=web.empresa.local,10.0.1.10
host-record=arquivos.empresa.local,10.0.2.10
host-record=db.empresa.local,10.0.3.10

# DHCP apenas na LAN (10.0.2.0/24)
dhcp-range=interface:enp0s9,10.0.2.100,10.0.2.200,255.255.255.0,12h
dhcp-option=interface:enp0s9,option:router,10.0.2.1
dhcp-option=interface:enp0s9,option:dns-server,10.0.2.1
# Reserva estatica do servidor de arquivos
dhcp-host=08:00:27:64:f8:0a,arquivos,10.0.2.10
