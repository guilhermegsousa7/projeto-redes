# /etc/netplan/01-projeto.yaml (fw) - chmod 600
network:
  version: 2
  ethernets:
    enp0s3: {dhcp4: true}                      # WAN (NAT do VirtualBox)
    enp0s8: {addresses: [10.0.1.1/24]}         # DMZ
    enp0s9: {addresses: [10.0.2.1/24]}         # LAN
    enp0s10: {addresses: [10.0.3.1/24]}        # DB Zone
