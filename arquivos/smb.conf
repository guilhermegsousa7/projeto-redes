# /etc/samba/smb.conf - Servidor de Arquivos
[global]
   workgroup = EMPRESA
   server string = Servidor de Arquivos
   server role = standalone server
   interfaces = lo enp0s3
   bind interfaces only = yes
   hosts allow = 10.0.2.0/24 127.0.0.1
   hosts deny = 0.0.0.0/0
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 1000

[publico]
   path = /compartilhado/publico
   valid users = @todos
   read only = no
   create mask = 0660
   directory mask = 2770

[projetos]
   path = /compartilhado/projetos
   valid users = @devs @diretoria
   read only = yes
   write list = @devs
   create mask = 0660
   directory mask = 2770

[backups]
   path = /compartilhado/backups
   valid users = @backup_mgr @diretoria
   read only = yes
   write list = @backup_mgr
   create mask = 0660
   directory mask = 2770
